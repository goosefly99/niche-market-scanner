<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} — Niche Market Scanner</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: { DEFAULT: '#1a1a2e', light: '#16213e', dark: '#0f0f1a' },
                        accent: { DEFAULT: '#e94560', light: '#ff6b81' },
                    }
                }
            }
        }
    </script>

    <!-- HTMX via CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.8"></script>

    <style>
        body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
        /* Scrollbar styling for dark theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a1a2e; }
        ::-webkit-scrollbar-thumb { background: #4a4a6a; border-radius: 4px; }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="bg-surface-dark text-gray-200 min-h-screen flex" hx-boost="true">

    <!-- Sidebar Navigation -->
    <nav class="w-56 bg-surface min-h-screen flex flex-col border-r border-gray-700/50 sticky top-0">
        <div class="p-4 border-b border-gray-700/50">
            <h1 class="text-lg font-bold text-white tracking-tight">NMS Dashboard</h1>
            <p class="text-xs text-gray-400 mt-1">Kalshi Scanner Monitor</p>
        </div>

        <div class="flex-1 py-4 space-y-1 px-2">
            <a href="/"
               class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
                      {% if active_page == 'overview' %}bg-surface-light text-white{% else %}text-gray-400 hover:text-white hover:bg-surface-light/50{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zm10 0a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                </svg>
                Overview
            </a>
            <a href="/trades"
               class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
                      {% if active_page == 'trades' %}bg-surface-light text-white{% else %}text-gray-400 hover:text-white hover:bg-surface-light/50{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                Trades
            </a>
            <a href="/signals"
               class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
                      {% if active_page == 'signals' %}bg-surface-light text-white{% else %}text-gray-400 hover:text-white hover:bg-surface-light/50{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                Signals
            </a>
            <a href="/config"
               class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition-colors
                      {% if active_page == 'config' %}bg-surface-light text-white{% else %}text-gray-400 hover:text-white hover:bg-surface-light/50{% endif %}">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                Config
            </a>
        </div>

        <!-- Scanner status footer -->
        <div class="p-4 border-t border-gray-700/50 text-xs text-gray-500">
            <p>Scanner v0.1.0</p>
        </div>
    </nav>

    <!-- Main content area -->
    <div class="flex-1 flex flex-col">

        <!-- Top header bar with kill switch -->
        <header class="h-14 bg-surface border-b border-gray-700/50 flex items-center justify-between px-6 sticky top-0 z-40">
            <h2 class="text-sm font-semibold text-gray-300">
                {% block page_title %}Overview{% endblock %}
            </h2>

            <!-- Kill Switch — persistent, visible on ALL pages -->
            <button id="kill-switch-btn"
                    hx-post="/api/risk/kill"
                    hx-headers='{"X-Confirm": "true"}'
                    hx-target="#kill-switch-response"
                    hx-swap="innerHTML"
                    class="bg-red-600 hover:bg-red-500 active:bg-red-700
                           text-white font-bold text-sm px-5 py-2 rounded-lg
                           shadow-lg shadow-red-900/30 transition-all
                           border border-red-500/50">
                KILL SWITCH
            </button>
        </header>

        <!-- Kill switch undo toast (hidden by default, shown after kill activation) -->
        <div id="kill-switch-response"></div>

        <!-- Kill status banner — shown when RiskGuard.is_killed is True -->
        {% if killed %}
        <div class="bg-red-900/80 border-b border-red-600 px-6 py-2 text-red-200 text-sm font-medium flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                      d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
                      clip-rule="evenodd"/>
            </svg>
            KILL SWITCH ACTIVE{% if kill_reason %} — {{ kill_reason }}{% endif %}
        </div>
        {% endif %}

        <!-- Page content -->
        <main class="flex-1 p-6">
            {% block content %}{% endblock %}
        </main>
    </div>

</body>
</html>
