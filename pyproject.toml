[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "niche-market-scanner"
version = "0.1.0"
description = "Niche market edge scanner for Polymarket — weather, sports, and prop market prediction with Bayesian edge detection and Kelly sizing"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"

dependencies = [
    "httpx>=0.27",
    "aiohttp>=3.9",
    "pandas>=2.2",
    "numpy>=1.26",
    "APScheduler>=3.10",
    "python-telegram-bot>=21.0",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "py-clob-client>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "mypy>=1.9",
]
simmer = [
    "simmer-sdk",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
